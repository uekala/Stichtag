<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stichtag</title>
<style>
:root{
  /* Layout: eine schmale Spalte wie ein Laborjournal, Tabs oben, Zahlen in Mono */
  --bg:#EEF2F1; --surface:#FBFCFC; --ink:#12201E; --muted:#5A6B68; --line:#D5DEDC;
  --accent:#0B6E60; --accent-ink:#FFFFFF; --accent-soft:#DCEDE9;
  --ok:#1E7A3C; --warn:#A85D00; --crit:#B3261E;
  --font-display:'Segoe UI',system-ui,sans-serif;
  --font-body:'Segoe UI',system-ui,sans-serif;
  --font-mono:ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1514; --surface:#172120; --ink:#E4ECEA; --muted:#94A5A2; --line:#2A3836;
    --accent:#5CCDB8; --accent-ink:#06211C; --accent-soft:#1D3531;
    --ok:#6CCB86; --warn:#E3A44B; --crit:#F2877F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1514; --surface:#172120; --ink:#E4ECEA; --muted:#94A5A2; --line:#2A3836;
  --accent:#5CCDB8; --accent-ink:#06211C; --accent-soft:#1D3531;
  --ok:#6CCB86; --warn:#E3A44B; --crit:#F2877F; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45}
.wrap{max-width:600px;margin:0 auto;padding:0 16px 64px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:700;font-size:1.5rem;margin:0;letter-spacing:-.01em}
.sync{font-size:.78rem;color:var(--muted)}
nav{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
nav a{flex:0 0 auto;padding:8px 12px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.95rem;border-bottom:3px solid transparent}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
h2{font-family:var(--font-display);font-weight:700;font-size:1.15rem;margin:0;text-wrap:balance}
h3{font-size:1rem;font-weight:600;margin:0}
main{display:flex;flex-direction:column;gap:20px;padding-top:20px}
section{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.done{border-left:4px solid var(--ok)}
.card.open{border-left:4px solid var(--warn)}
.muted{color:var(--muted);font-size:.88rem}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.big{font-family:var(--font-mono);font-size:1.6rem;font-weight:500;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.crit{color:var(--crit)} .pill.neutral{color:var(--muted)}
a.btn{text-decoration:none}
button,.btn{font:inherit;font-weight:600;font-size:.92rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 8px}
button.danger{color:var(--crit)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{background:var(--accent-soft);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.92rem}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:400px){.summary{grid-template-columns:1fr}}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;color:var(--muted)}
.dot{width:100%;height:10px;border-radius:5px;background:var(--line)}
.dot.full{background:var(--ok)} .dot.part{background:var(--warn)} .dot.miss{background:var(--crit)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.low>i{background:var(--warn)}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:500;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical;font-family:var(--font-mono);font-size:.85rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.checks label{flex-direction:row;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--ink)}
.checks input{width:auto}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:0;width:min(520px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{display:flex;flex-direction:column;gap:12px;padding:18px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.out{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.out div{display:flex;flex-direction:column;gap:2px}
.note{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font-mono);font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .end{fill:var(--accent)}
.up{color:var(--warn)} .down{color:var(--ok)}
.qr{max-width:240px;background:#fff;padding:8px;border-radius:8px}
.qr svg{width:100%;height:auto;display:block}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;flex:0 0 auto}
.ringrow{display:flex;align-items:center;gap:12px}
.ring{width:58px;height:58px;flex:0 0 auto}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--accent);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.card.alert{border-left:4px solid var(--warn)}
.up-row{display:flex;gap:12px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line)}
.up-row:first-of-type{border-top:0}
.up-row .when{flex:0 0 96px;font-size:.85rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 10px 10px 16px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast button{background:transparent;border-color:transparent;color:var(--bg);text-decoration:underline;padding:4px 8px}
.bars{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end}
.bcol{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;color:var(--muted);min-width:0}
.btrack{width:100%;height:90px;background:var(--line);border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}
.btrack i{display:block;width:100%;background:var(--accent)}
.btrack.none{background:transparent;border:1px dashed var(--line)}
.hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 34px;gap:10px;align-items:center;font-size:.9rem}
.hbar .num{text-align:right}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.check input{width:auto}
.hide{display:none!important}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .3s}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top"><div class="brand"><svg class="logo" viewBox="0 0 108 108" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12907E"/><stop offset="1" stop-color="#07453C"/></linearGradient></defs><rect width="108" height="108" rx="26" fill="url(#lg)"/><path fill="#fff" d="M30 38a8 8 0 0 1 8-8h32a8 8 0 0 1 8 8v36a8 8 0 0 1-8 8H38a8 8 0 0 1-8-8z"/><path stroke="#fff" stroke-width="6" stroke-linecap="round" d="M42 23v10M66 23v10"/><path fill="#0B6E60" d="M54 42c0 0-11 12-11 20a11 11 0 0 0 22 0c0-8-11-20-11-20z"/></svg><h1>Stichtag</h1></div><span class="sync" id="sync">Lädt …</span></div>
  <nav id="nav">
    <a href="#heute">Heute</a><a href="#plan">Protokolle</a><a href="#verlauf">Verlauf</a><a href="#auswertung">Auswertung</a><a href="#koerper">Körper</a><a href="#vials">Vials &amp; Rechner</a><a href="#daten">Daten</a>
  </nav>
</header>
<main id="view"></main>
</div>
<div id="toast" class="toast hide" role="status"><span></span><button data-act="undo">Rückgängig</button></div>
<dialog id="dlg"><form id="dlgform" method="dialog"></form></dialog>

<script src="qrcode.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c,12)};
const dayDiff=(a,b)=>Math.round((parseYmd(b)-parseYmd(a))/864e5);
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const nowLocal=()=>{const d=new Date();return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:NaN};
const fmt=(n,d=2)=>Number(n).toLocaleString('de-DE',{maximumFractionDigits:d});
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const deDate=s=>{const d=parseYmd(s);return WD[d.getDay()]+', '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()};
const DEFAULT_SITES=['Bauch links','Bauch rechts','Oberschenkel links','Oberschenkel rechts','Flanke links','Flanke rechts'];
const LS='peptid-tracker-v1';

function blank(){return{v:1,rev:0,demo:false,protocols:[],logs:[],vials:[],body:[],sites:DEFAULT_SITES.slice(),settings:{notify:'',followup:0,lowvial:true}}}
function demoState(){
  const t=today(),s=blank();s.demo=true;
  const v={id:uid(),demo:true,name:'Beispiel A',mg:5,ml:2,mixed:addDays(t,-6)};
  const a={id:uid(),demo:true,name:'Beispiel A',dose:250,unit:'mcg',type:'daily',n:2,days:[],start:addDays(t,-6),weeks:8,time:'08:00',active:true,vialId:v.id};
  const b={id:uid(),demo:true,name:'Beispiel B',dose:2,unit:'mg',type:'weekdays',n:2,days:[parseYmd(t).getDay()],start:addDays(t,-21),weeks:0,time:'20:00',active:true,vialId:''};
  s.vials=[v];s.protocols=[a,b];
  [6,5,4,2,1].forEach((k,i)=>s.logs.push({id:uid(),demo:true,ts:addDays(t,-k)+'T08:0'+i,pid:a.id,name:a.name,dose:250,unit:'mcg',site:DEFAULT_SITES[i%4],feel:4,note:'',vialId:v.id}));
  s.logs.push({id:uid(),demo:true,ts:addDays(t,-7)+'T20:10',pid:b.id,name:b.name,dose:2,unit:'mg',site:DEFAULT_SITES[4],feel:3,note:'Beispieleintrag',vialId:''});
  [[21,84.2,92],[14,83.9,91.5],[7,83.5,91],[0,83.1,90]].forEach(x=>s.body.push({id:uid(),demo:true,date:addDays(t,-x[0]),weight:x[1],waist:x[2],fat:0,note:''}));
  return s;
}
function normalize(o){const b=blank();if(!o||typeof o!=='object')return b;
  return{v:1,rev:+o.rev||0,demo:!!o.demo,protocols:Array.isArray(o.protocols)?o.protocols:[],logs:Array.isArray(o.logs)?o.logs:[],vials:Array.isArray(o.vials)?o.vials:[],body:Array.isArray(o.body)?o.body:[],sites:Array.isArray(o.sites)&&o.sites.length?o.sites.map(String):b.sites,settings:{notify:String((o.settings||{}).notify||''),followup:Math.max(0,Math.round(+(o.settings||{}).followup)||0),lowvial:(o.settings||{}).lowvial!==false}}}

let state=blank(),mobile=null,pairing=null,services=null,saving=false,dirty=false,loaded=false;
function setSync(t){$('#sync').textContent=t}
const isEmpty=s=>!s.protocols.length&&!s.logs.length&&!s.vials.length&&!s.body.length;
async function load(){
  try{
    const r=await fetch('api/state',{cache:'no-store'});if(!r.ok)throw 0;
    const j=normalize(await r.json());if(loaded&&j.rev===state.rev)return;
    state=(j.rev===0&&isEmpty(j))?demoState():j;loaded=true;setSync('In Home Assistant gespeichert');render();
  }catch(e){
    setSync('Home Assistant nicht erreichbar. Seite neu laden.');
    if(!loaded)$('#view').innerHTML='<div class="card"><span class="muted">Die Daten konnten nicht geladen werden.</span></div>';
  }
}
function save(){dirty=true;flush()}
async function flush(){
  if(saving||!dirty)return;
  saving=true;dirty=false;setSync('Speichert …');
  try{
    const r=await fetch('api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});
    if(r.status===409){state=normalize(await r.json());render();setSync('Auf einem anderen Gerät geändert. Neu geladen, bitte die letzte Eingabe wiederholen.')}
    else if(!r.ok)throw 0;
    else{state.rev=(await r.json()).rev;setSync('In Home Assistant gespeichert')}
  }catch(e){dirty=true;saving=false;setSync('Speichern fehlgeschlagen. Neuer Versuch in 5 Sekunden.');setTimeout(flush,5000);return}
  saving=false;if(dirty)flush();
}
async function loadServices(){
  try{const r=await fetch('api/notify-services',{cache:'no-store'});services=r.ok?await r.json():[]}catch(e){services=[]}
  if(loaded&&current()==='daten'&&!dlg.open)render();
}
async function loadMobile(){
  try{const r=await fetch('api/mobile',{cache:'no-store'});mobile=r.ok?await r.json():{error:true}}catch(e){mobile={error:true}}
  if(loaded&&current()==='daten'&&!dlg.open)render();
}
function mobileCard(){
  if(!mobile)return `<span class="muted">Lädt …</span>`;
  if(mobile.error)return `<span class="muted">Die Geräteverwaltung ist gerade nicht erreichbar.</span><div class="actions"><button data-act="reload-mobile">Erneut versuchen</button></div>`;
  if(!mobile.server_url)return `<span class="muted">Die Handy-App ist noch nicht eingerichtet. Trage in der Konfiguration dieser App unter „mobile_server_url“ die HTTPS-Adresse ein, unter der dein Handy Stichtag erreicht. Die Schritte stehen im Reiter Dokumentation.</span>`;
  if(pairing&&pairing.until<Date.now())pairing=null;
  const devs=mobile.devices.map(d=>`<div class="row"><span><strong>${esc(d.name)}</strong><br><span class="muted">Gekoppelt ${esc(String(d.created).slice(0,10))} · zuletzt aktiv ${esc(String(d.last_used).slice(0,10))}</span></span><button class="ghost danger" data-act="del-dev" data-id="${esc(d.id)}">Entfernen</button></div>`).join('');
  return `<span class="muted">Adresse für die Handy-App: <span class="num">${esc(mobile.server_url)}</span></span>
  ${pairing?`<div class="qr">${pairing.svg}</div><span class="muted">In der Stichtag-App „QR-Code scannen“ wählen. Der Code gilt 10 Minuten und nur einmal. Ohne Kamera den Text unten in die App kopieren.</span><textarea readonly id="pair-text">${esc(pairing.text)}</textarea>`:''}
  ${devs||`<span class="muted">Noch kein Handy gekoppelt.</span>`}
  <div class="actions"><button data-act="reload-mobile">Geräteliste aktualisieren</button><button class="primary" data-act="pair">Handy koppeln</button></div><span class="muted" id="mob-msg"></span>`;
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&loaded&&!dirty&&!saving&&!dlg.open)load()});

/* ---------- Logik ---------- */
function isDue(p,day){
  if(!p.active)return false;
  const diff=dayDiff(p.start,day);if(diff<0)return false;
  if(p.weeks>0&&diff>=p.weeks*7)return false;
  if(p.type==='daily')return true;
  if(p.type==='interval')return diff%Math.max(1,p.n||1)===0;
  return (p.days||[]).includes(parseYmd(day).getDay());
}
const logsOn=day=>state.logs.filter(l=>l.ts.slice(0,10)===day);
function freqLabel(p){
  if(p.type==='daily')return'täglich';
  if(p.type==='interval')return'alle '+p.n+' Tage';
  const order=[1,2,3,4,5,6,0];return order.filter(d=>(p.days||[]).includes(d)).map(d=>WD[d]).join(', ')||'keine Tage gewählt';
}
function nextSite(){
  const last={};state.logs.forEach(l=>{if(l.site&&(!last[l.site]||l.ts>last[l.site]))last[l.site]=l.ts});
  return state.sites.slice().sort((a,b)=>(last[a]||'').localeCompare(last[b]||''))[0]||'';
}
function vialLeft(v){
  let used=0;state.logs.forEach(l=>{if(l.vialId===v.id){if(l.unit==='mcg')used+=l.dose;else if(l.unit==='mg')used+=l.dose*1000}});
  const total=v.mg*1000,left=Math.max(0,total-used);return{left,total,pct:total>0?left/total*100:0};
}
function adherence(day){
  const due=state.protocols.filter(p=>isDue(p,day));if(!due.length)return{due:0,done:0};
  const ids=new Set(logsOn(day).map(l=>l.pid));return{due:due.length,done:due.filter(p=>ids.has(p.id)).length};
}

/* ---------- Ansichten ---------- */
const VIEWS=['heute','plan','verlauf','auswertung','koerper','vials','daten'];
const METRICS={weight:['Gewicht','kg'],waist:['Bauchumfang','cm'],fat:['Körperfett','%']};
let bmetric='weight';
let verlaufFilter='';
function current(){const h=location.hash.replace('#','');return VIEWS.includes(h)?h:'heute'}
function render(){
  const v=current();
  document.querySelectorAll('#nav a').forEach(a=>{if(a.getAttribute('href')==='#'+v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  const banner=state.demo?`<div class="banner"><span>Das sind Beispieldaten, damit du siehst, wie alles aussieht.</span><button data-act="clear-demo">Beispieldaten entfernen</button></div>`:'';
  $('#view').innerHTML=banner+({heute:vHeute,plan:vPlan,verlauf:vVerlauf,auswertung:vAuswertung,koerper:vKoerper,vials:vVials,daten:vDaten}[v])();
  if(v==='vials')calc();
}
function ring(done,due){
  const r=24,c=2*Math.PI*r,f=due?done/due:0;
  return `<svg class="ring" viewBox="0 0 58 58" role="img" aria-label="${done} von ${due} erledigt"><circle class="bg" cx="29" cy="29" r="${r}"/><circle class="fg" cx="29" cy="29" r="${r}" stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}"/></svg>`;
}
function vHeute(){
  const t=today(),due=state.protocols.filter(p=>isDue(p,t)),tl=logsOn(t);
  const done=due.filter(p=>tl.some(l=>l.pid===p.id)).length;
  let week='';for(let i=6;i>=0;i--){const d=addDays(t,-i),a=adherence(d);const c=!a.due?'':a.done===a.due?'full':a.done>0?'part':(i===0?'':'miss');week+=`<div class="day"><span class="dot ${c}" title="${a.done} von ${a.due}"></span>${WD[parseYmd(d).getDay()]}</div>`}
  const cards=due.map(p=>{const l=tl.find(x=>x.pid===p.id);const cyc=p.weeks>0?` · Tag ${dayDiff(p.start,t)+1} von ${p.weeks*7}`:'';
    return `<div class="card ${l?'done':'open'}"><div class="row"><h3>${esc(p.name)}</h3><span class="pill ${l?'ok':'warn'}">${l?'Erledigt':'Offen'}</span></div>
    <span><span class="num">${fmt(p.dose,3)} ${esc(p.unit)}</span> <span class="muted">${p.time?'· '+esc(p.time)+' Uhr':''}${cyc}</span></span>
    ${l?`<div class="row"><span class="muted">${esc(l.ts.slice(11))} Uhr${l.site?' · '+esc(l.site):''}</span><button class="ghost" data-act="edit-log" data-id="${l.id}">Bearbeiten</button></div>`
      :`<div class="actions"><button data-act="log" data-pid="${p.id}">Anpassen</button><button class="primary" data-act="quick" data-pid="${p.id}">Erledigt</button></div>`}</div>`}).join('');

const nE=n=>n+(n===1?' Eintrag':' Einträge');
function amount(sums){return Object.keys(sums).map(u=>u==='mcg'&&sums[u]>=1000?fmt(sums[u]/1000,2)+' mg':fmt(sums[u],2)+' '+u).join(' + ')}
function weekStats(t,weeks){const out=[];for(let w=weeks-1;w>=0;w--){let due=0,done=0;for(let i=6;i>=0;i--){const a=adherence(addDays(t,-(w*7+i)));due+=a.due;done+=a.done}out.push({start:addDays(t,-(w*7+6)),due,done})}return out}
function peptideStats(t){
  const from=addDays(t,-29),map={};
  state.logs.forEach(l=>{const m=map[l.name]=map[l.name]||{name:l.name,total:0,recent:0,sums:{},last:'',pid:''};m.total++;if(l.ts>m.last)m.last=l.ts;if(l.pid)m.pid=l.pid;
    if(l.ts.slice(0,10)>=from){m.recent++;m.sums[l.unit]=(m.sums[l.unit]||0)+(+l.dose||0)}});
  return Object.values(map).sort((a,b)=>b.last.localeCompare(a.last)).map(m=>{
    const p=state.protocols.find(x=>x.id===m.pid);let due=0,done=0;
    if(p)for(let i=0;i<30;i++){const d=addDays(t,-i);if(isDue(p,d)){due++;if(state.logs.some(l=>l.pid===p.id&&l.ts.slice(0,10)===d))done++}}
    return Object.assign(m,{due,done})});
}
function vAuswertung(){

  const tot=ws.reduce((a,w)=>({due:a.due+w.due,done:a.done+w.done}),{due:0,done:0});
  const peps=peptideStats(t).map(m=>`<div class="card"><div class="row"><h3>${esc(m.name)}</h3><span class="muted">${nE(m.total)} gesamt</span></div>
    <span>${m.recent?`${nE(m.recent)} in 30 Tagen · <span class="num">${esc(amount(m.sums))}</span>`:'Keine Einträge in den letzten 30 Tagen'}</span>
    <span class="muted">Zuletzt ${deDate(m.last.slice(0,10))}</span>
    ${m.due?`<div class="row"><span class="muted">Einhaltung 30 Tage</span><span class="num">${m.done} von ${m.due} · ${Math.round(m.done/m.due*100)} %</span></div><div class="bar ${m.done/m.due<.8?'low':''}"><i style="width:${(m.done/m.due*100).toFixed(1)}%"></i></div>`:''}</div>`).join('');
  const feel={};state.logs.forEach(l=>{const d=l.ts.slice(0,10);if(l.feel>0&&d>=from60){(feel[d]=feel[d]||[]).push(+l.feel)}});
  const fpts=Object.keys(feel).sort().map(d=>({date:d,v:feel[d].reduce((a,b)=>a+b,0)/feel[d].length}));
  const sc={};state.logs.forEach(l=>{if(l.site&&l.ts.slice(0,10)>=from30)sc[l.site]=(sc[l.site]||0)+1});

  return `<section><h2>Einhaltung</h2><div class="card"><div class="row"><span class="muted">Letzte 8 Wochen, je 7 Tage ab dem angegebenen Datum</span><span class="num">${tot.due?Math.round(tot.done/tot.due*100)+' % gesamt':'–'}</span></div><div class="bars">${bars}</div></div></section>
  <section><h2>Je Peptid</h2>${peps||`<div class="card"><span class="muted">Noch keine Einträge.</span></div>`}</section>
  <section><h2>Befinden</h2><div class="card"><span class="muted">Mittelwert je Tag, letzte 60 Tage (1 = schlecht, 5 = sehr gut)</span>${fpts.length<2?`<span class="muted">Ab zwei Tagen mit Angabe erscheint hier die Kurve.</span>`:chart(fpts,'Befinden')}</div></section>

function chart(pts,unit){
  if(pts.length<2)return `<span class="muted">Ab zwei Messwerten erscheint hier die Kurve.</span>`;
  const W=560,H=200,L=50,R=14,T=14,B=26,xs=pts.map(p=>parseYmd(p.date).getTime()),ys=pts.map(p=>p.v);
  const mn=Math.min(...ys),mx=Math.max(...ys);let lo=mn,hi=mx;if(hi-lo<1e-9){lo-=1;hi+=1}else{const d=(hi-lo)*.15;lo-=d;hi+=d}
  const x0=xs[0],x1=xs[xs.length-1],X=t=>L+(t-x0)/(x1-x0)*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const c=pts.map((p,i)=>[X(xs[i]).toFixed(1),Y(p.v).toFixed(1)]),path=c.map((q,i)=>(i?'L':'M')+q[0]+' '+q[1]).join(' ');
  const ticks=mx-mn<1e-9?[mn]:[mn,mx],dm=s=>s.slice(8,10)+'.'+s.slice(5,7)+'.';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf in ${esc(unit)}">
  ${ticks.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${L-6}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${fmt(v,1)}</text>`).join('')}
  <path class="area" d="${path} L${c[c.length-1][0]} ${H-B} L${c[0][0]} ${H-B} Z"/><path class="line" d="${path}"/>
  ${c.map((q,i)=>`<circle class="${i===c.length-1?'end':'pt'}" cx="${q[0]}" cy="${q[1]}" r="${i===c.length-1?5:3}"/>`).join('')}
  <text x="${L}" y="${H-6}">${dm(pts[0].date)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${dm(pts[pts.length-1].date)}</text></svg>`;
}

function calc(){

  o.innerHTML=`<div><span class="muted">Aufziehen</span><span class="big">${fmt(units,1)} E</span></div><div><span class="muted">Volumen</span><span class="big">${fmt(vol,3)} ml</span></div>

  $('#c-warn').textContent=dose>mg*1000?'Die Dosis ist größer als der Inhalt des Vials.':units>100?'Das sind mehr als 100 Einheiten, also mehr als eine 1-ml-Spritze fasst.':units<2?'Unter 2 Einheiten lässt sich kaum genau aufziehen. Mit mehr Wasser wird das Volumen größer.':'';
}

  const p=state.protocols.find(x=>x.id===pid);if(!p)return;
  const id=uid();state.logs.push({id,ts:nowLocal(),pid:p.id,name:p.name,dose:p.dose,unit:p.unit,site:nextSite(),feel:0,note:'',vialId:p.vialId||''});
  save();render();toast('Eingetragen: '+p.name,id);
}
let toastTimer=null,undoId='';
function toast(text,id){undoId=id;const t=$('#toast');t.querySelector('span').textContent=text;t.classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hide'),8000)}
function dlgProtocol(id){
  const p=state.protocols.find(x=>x.id===id)||{type:'daily',n:2,days:[],start:today(),weeks:'',unit:'mcg',time:''};
  openDlg('protocol',`<h2>${id?'Protokoll bearbeiten':'Neues Protokoll'}</h2><input type="hidden" id="f-id" value="${esc(id||'')}">
  <label>Peptid<input id="f-name" required value="${esc(p.name||'')}"></label>
  <div class="grid3"><label>Dosis<input id="f-dose" inputmode="decimal" required value="${p.dose??''}"></label><label>Einheit<select id="f-unit">${unitOpts(p.unit)}</select></label></div>
  <label>Rhythmus<select id="f-type"><option value="daily" ${p.type==='daily'?'selected':''}>Täglich</option><option value="interval" ${p.type==='interval'?'selected':''}>Alle N Tage</option><option value="weekdays" ${p.type==='weekdays'?'selected':''}>Bestimmte Wochentage</option></select></label>
  <label id="f-n-wrap">Abstand in Tagen<input id="f-n" inputmode="numeric" value="${p.n||2}"></label>
  <div class="checks" id="f-days-wrap">${[1,2,3,4,5,6,0].map(d=>`<label><input type="checkbox" id="f-day-${d}" value="${d}" ${(p.days||[]).includes(d)?'checked':''}>${WD[d]}</label>`).join('')}</div>
  <div class="grid2"><label>Startdatum<input id="f-start" type="date" required value="${esc(p.start)}"></label><label>Uhrzeit (optional)<input id="f-time" type="time" value="${esc(p.time||'')}"></label></div>
  <div class="grid2"><label>Zyklus in Wochen (leer = offen)<input id="f-weeks" inputmode="numeric" value="${p.weeks||''}"></label><label>Standard-Vial<select id="f-vial">${vialOpts(p.vialId||'')}</select></label></div>${foot('Speichern')}`);
  typeVis();
}
function typeVis(){const t=$('#f-type');if(!t)return;$('#f-n-wrap').classList.toggle('hide',t.value!=='interval');$('#f-days-wrap').classList.toggle('hide',t.value!=='weekdays')}
function dlgVial(id){
  const v=state.vials.find(x=>x.id===id)||{mixed:today()};
  openDlg('vial',`<h2>${id?'Vial bearbeiten':'Neues Vial'}</h2><input type="hidden" id="f-id" value="${esc(id||'')}">
  <label>Bezeichnung<input id="f-name" required value="${esc(v.name||'')}"></label>
  <div class="grid2"><label>Inhalt (mg)<input id="f-mg" inputmode="decimal" required value="${v.mg??''}"></label><label>Wasser (ml, optional)<input id="f-ml" inputmode="decimal" value="${v.ml||''}"></label></div>
  <label>Angemischt am<input id="f-mixed" type="date" value="${esc(v.mixed||'')}"></label>${foot('Speichern')}`);
}
function dlgConfirm(text,kind,id){openDlg('confirm',`<h2>${esc(text)}</h2><input type="hidden" id="f-kind" value="${esc(kind)}"><input type="hidden" id="f-id" value="${esc(id||'')}"><div class="actions"><button type="button" data-act="close">Abbrechen</button><button class="primary" type="submit">Löschen</button></div>`)}
const err=m=>{const e=$('#f-err');if(e)e.textContent=m};

form.addEventListener('submit',ev=>{
  ev.preventDefault();const k=form.dataset.kind,val=id=>($('#'+id)||{}).value||'';
  if(k==='log'){
    const dose=num(val('f-dose')),name=val('f-name').trim();if(!name||!(dose>0))return err('Bitte Peptid und eine Dosis größer als 0 angeben.');
    let pid=val('f-pid');const pr=state.protocols.find(p=>p.id===pid);
    if(!pr||pr.name!==name){const m=state.protocols.find(p=>p.name.toLowerCase()===name.toLowerCase());pid=m?m.id:''}
    const rec={ts:val('f-ts')||nowLocal(),pid,name,dose,unit:val('f-unit'),site:val('f-site'),feel:+val('f-feel')||0,note:val('f-note').trim(),vialId:val('f-vial')},old=state.logs.find(l=>l.id===val('f-lid'));
    if(old)Object.assign(old,rec);else state.logs.push({id:uid(),...rec});
  }else if(k==='protocol'){
    const dose=num(val('f-dose')),name=val('f-name').trim(),type=val('f-type');if(!name||!(dose>0)||!val('f-start'))return err('Bitte Peptid, Dosis und Startdatum angeben.');
    const days=[0,1,2,3,4,5,6].filter(d=>$('#f-day-'+d).checked);if(type==='weekdays'&&!days.length)return err('Bitte mindestens einen Wochentag wählen.');
    const o={name,dose,unit:val('f-unit'),type,n:Math.max(1,Math.round(num(val('f-n')))||1),days,start:val('f-start'),weeks:Math.max(0,Math.round(num(val('f-weeks')))||0),time:val('f-time'),vialId:val('f-vial')};
    const ex=state.protocols.find(p=>p.id===val('f-id'));if(ex)Object.assign(ex,o);else state.protocols.push({id:uid(),active:true,...o});
  }else if(k==='vial'){
    const mg=num(val('f-mg')),name=val('f-name').trim();if(!name||!(mg>0))return err('Bitte Bezeichnung und Inhalt in mg angeben.');
    const o={name,mg,ml:num(val('f-ml'))>0?num(val('f-ml')):0,mixed:val('f-mixed')};
    const ex=state.vials.find(v=>v.id===val('f-id'));if(ex)Object.assign(ex,o);else state.vials.push({id:uid(),...o});
  }else if(k==='body'){
    const g=i=>{const n=num(val(i));return n>0?n:0},o={date:val('f-date'),weight:g('f-weight'),waist:g('f-waist'),fat:g('f-fat'),note:val('f-note').trim()};
    if(!o.date||!(o.weight||o.waist||o.fat))return err('Bitte Datum und mindestens einen Messwert angeben.');
    const id=val('f-id');state.body=state.body.filter(x=>x.id!==id&&x.date!==o.date);state.body.push({id:id||uid(),...o});
  }else if(k==='confirm'){
    const kind=val('f-kind'),id=val('f-id');
    if(kind==='all')state=Object.assign(blank(),{rev:state.rev,settings:state.settings});else state[kind]=state[kind].filter(x=>x.id!==id);
  }
  dlg.close();save();render();
});
form.addEventListener('change',e=>{if(e.target.id==='f-type')typeVis()});

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==='close')dlg.close();
  else if(a==='log')dlgLog(b.dataset.pid);
  else if(a==='edit-log')dlgLog('',id);
  else if(a==='quick')quickLog(b.dataset.pid);
  else if(a==='undo'){state.logs=state.logs.filter(l=>l.id!==undoId);$('#toast').classList.add('hide');save();render()}
  else if(a==='edit-p')dlgProtocol(id);
  else if(a==='edit-v')dlgVial(id);
  else if(a==='edit-b')dlgBody(id);
  else if(a==='toggle-p'){const p=state.protocols.find(x=>x.id===id);if(p){p.active=!p.active;save();render()}}
  else if(a==='del')dlgConfirm({protocols:'Dieses Protokoll löschen? Der Verlauf bleibt erhalten.',logs:'Diesen Eintrag löschen?',vials:'Dieses Vial löschen?',body:'Diese Messung löschen?'}[b.dataset.kind],b.dataset.kind,id);
  else if(a==='wipe')dlgConfirm('Wirklich alle Daten löschen? Das lässt sich nicht rückgängig machen.','all','');
  else if(a==='clear-demo'){['protocols','logs','vials','body'].forEach(k=>state[k]=state[k].filter(x=>!x.demo));state.demo=false;save();render()}
  else if(a==='vial-calc'){const v=state.vials.find(x=>x.id===id);if(v){$('#c-mg').value=v.mg;if(v.ml)$('#c-ml').value=v.ml;calc();$('#c-mg').scrollIntoView({block:'center'})}}
  else if(a==='save-sites'){const s=$('#sites').value.split('\n').map(x=>x.trim()).filter(Boolean);state.sites=[...new Set(s)];save();render()}
  else if(a==='save-rem'){state.settings={notify:$('#r-notify').value,followup:Math.max(0,Math.round(num($('#r-follow').value))||0),lowvial:$('#r-lowvial').checked};save();render();$('#r-msg').textContent='Gespeichert.'}
  else if(a==='test-notify'){const s=$('#r-notify').value,m=$('#r-msg');if(!s){m.textContent='Bitte zuerst einen Dienst wählen.';return}m.textContent='Sendet …';
    try{const r=await fetch('api/test-notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service:s})}),j=await r.json();m.textContent=j.ok?'Testnachricht gesendet. Kommt sie nicht an, prüfe den gewählten Dienst.':'Senden fehlgeschlagen: '+(j.error||'unbekannter Fehler')}catch(x){m.textContent='Senden fehlgeschlagen. Verbindung zu Home Assistant prüfen.'}}
  else if(a==='pair'){
    try{const r=await fetch('api/pairing',{method:'POST'}),j=await r.json();if(!r.ok)throw new Error(j.error||'');
      const t=JSON.stringify(j.payload),q=qrcode(0,'M');q.addData(t);q.make();
      pairing={svg:q.createSvgTag({cellSize:4,margin:4,scalable:true}),text:t,until:Date.now()+j.expires_in*1000};render()}
    catch(x){pairing=null;render();const m=$('#mob-msg');if(m)m.textContent='Der Kopplungscode konnte nicht erzeugt werden. '+(x.message||'')}}
  else if(a==='del-dev'){try{await fetch('api/devices/'+encodeURIComponent(id),{method:'DELETE'})}catch(x){}loadMobile()}
  else if(a==='reload-mobile')loadMobile();
  else if(a==='export'){const j=JSON.stringify(state,null,1);$('#io').value=j;try{await navigator.clipboard.writeText(j);$('#io-msg').textContent='Export in die Zwischenablage kopiert.'}catch(x){$('#io-msg').textContent='Kopieren wurde blockiert. Markiere den Text im Feld und kopiere ihn von Hand.'}}
  else if(a==='import'){try{const o=JSON.parse($('#io').value);if(!o||!Array.isArray(o.logs)||!Array.isArray(o.protocols))throw 0;state=Object.assign(normalize(o),{rev:state.rev,settings:state.settings});save();render()}catch(x){$('#io-msg').textContent='Das ist kein gültiger Export. Füge das komplette JSON aus „Export kopieren“ ein.'}}
});
document.addEventListener('input',e=>{if(e.target.id&&e.target.id.startsWith('c-'))calc()});
document.addEventListener('change',e=>{if(e.target.id==='vfilter'){verlaufFilter=e.target.value;render()}else if(e.target.id==='bmetric'){bmetric=e.target.value;render()}else if(e.target.id==='c-unit')calc()});
window.addEventListener('hashchange',render);
load();
loadServices();
loadMobile();
</script>
</body>
</html>
